
name: Build Forex Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o ForexScannerAndroid-source.zip -d extracted

      - name: Verify project files
        run: |
          ls -la extracted/ForexScannerAndroid
          test -f extracted/ForexScannerAndroid/settings.gradle

      - name: Build Android APK
        run: |
          gradle -p extracted/ForexScannerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForexScanner-apk
          path: extracted/ForexScannerAndroid/app/build/outputs/apk/debug/app-debug.apk
          
